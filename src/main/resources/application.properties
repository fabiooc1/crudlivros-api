spring.application.name=crudlivros
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

orchestrator.backends=${BACKENDS}
orchestrator.health-path=${BACKEND_HEALTH_PATH:/health}
orchestrator.health-check-interval=${HEALTH_CHECK_INTERVAL:3000}
orchestrator.health-check-timeout=${HEALTH_CHECK_TIMEOUT:1000}
orchestrator.proxy-connect-timeout=${PROXY_CONNECT_TIMEOUT:1000}
orchestrator.proxy-read-timeout=${PROXY_READ_TIMEOUT:3000}
orchestrator.failure-threshold=${FAILURE_THRESHOLD:3}
